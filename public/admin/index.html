<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客内容管理</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f6f6f6; }
    #nc-root { min-height: 100vh; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; z-index: 9999;
      background: #f6f6f6; color: #555; text-align: center; padding: 20px;
    }
    #splash .ring {
      width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #e07b9a;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    #splash .msg { font-size: 15px; line-height: 1.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Decap CMS 挂载点（nc-root），加载期间显示提示 -->
  <div id="nc-root">
    <div id="splash">
      <div class="ring"></div>
      <div class="msg">编辑器加载中，首次约需几秒，请稍候…</div>
    </div>
  </div>

  <!-- 优先国内镜像加载；失败自动切换本站备用文件 -->
  <script src="https://registry.npmmirror.com/decap-cms/3.9.0/files/dist/decap-cms.js"
          onerror="var s=this; s.onerror=function(){document.getElementById('splash').textContent='编辑器加载失败，请检查网络后按 Ctrl+F5 刷新重试。'}; s.src='./decap-cms.js';"></script>
</body>
</html>
